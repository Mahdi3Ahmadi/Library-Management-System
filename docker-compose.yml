version: "3.8"

services:
  web:
    build: ./LibraryProject
    container_name: django_web
    ports:
      - "8000:8000"
    volumes:
      - ./web:/app
    networks:
      - app-net

  nginx: 
    image: nginx:alpine
    container_name: nginx_web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - app-net

networks:
  app-net:
    driver: bridge